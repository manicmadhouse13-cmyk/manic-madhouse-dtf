<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product | Manic Madhouse DTF Designs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">

<div class="container">

<a class="navbar-brand" href="index.html">

<img src="images/logo.png">

</a>

</div>

</nav>

<section class="small-hero">

<div class="container">

<h1>Product Details</h1>

</div>

</section>

<section>

<div class="container">

<div class="row">

<div class="col-lg-6">

<img id="productImage" class="img-fluid rounded shadow">

</div>

<div class="col-lg-6">

<h2 id="productName"></h2>

<h3 id="productPrice"></h3>

<p>

Premium full-colour DTF transfer printed using high-quality film and inks.

Perfect for T-shirts, hoodies, bags and more.

</p>

<label>Select Size</label>

<select id="size" class="form-select mb-3">

<option value="Pocket">Pocket - $8</option>

<option value="A6">A6 - $10</option>

<option value="A5">A5 - $12</option>

<option value="A4" selected>A4 - $15</option>

<option value="A3">A3 - $20</option>

<option value="Custom">Custom Quote</option>

</select>

<label>Quantity</label>

<input type="number" id="qty" value="1" min="1" class="form-control mb-4">

<button id="addCart" class="btn btn-primary btn-lg">

🛒 Add To Cart

</button>

</div>

</div>

</div>

</section>

<script src="js/products.js"></script>
<script src="js/product.js"></script>

</body>

</html>
