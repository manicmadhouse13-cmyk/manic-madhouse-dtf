<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Manic Madhouse DTF Designs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">

<div class="container">

<a class="navbar-brand" href="index.html">

<img src="images/logo.png">

</a>

</div>

</nav>

<section class="small-hero">

<div class="container text-center">

<h1>Checkout</h1>

<p>Complete your order securely.</p>

</div>

</section>

<section>

<div class="container">

<div class="row">

<div class="col-lg-7">

<div class="checkout-box">

<h3>Customer Details</h3>

<input class="form-control mb-3" id="name" placeholder="Full Name">

<input class="form-control mb-3" id="email" placeholder="Email">

<input class="form-control mb-3" id="phone" placeholder="Phone">

<input class="form-control mb-3" id="address" placeholder="Street Address">

<input class="form-control mb-3" id="suburb" placeholder="Suburb">

<div class="row">

<div class="col-md-6">

<input class="form-control mb-3" id="state" placeholder="State">

</div>

<div class="col-md-6">

<input class="form-control mb-3" id="postcode" placeholder="Postcode">

</div>

</div>

<textarea class="form-control mb-3" rows="5" placeholder="Order Notes"></textarea>

</div>

</div>

<div class="col-lg-5">

<div class="checkout-summary">

<h3>Order Summary</h3>

<div id="summaryItems"></div>

<hr>

<h2>

Total

$<span id="summaryTotal">0</span>

</h2>

<div class="d-grid gap-3 mt-4">

<button class="btn btn-primary btn-lg" id="paypalBtn">

Pay with PayPal

</button>

<button class="btn btn-outline-light btn-lg" id="stripeBtn">

Pay with Card

</button>

</div>

</div>

</div>

</div>

</div>

</section>

<script src="js/checkout.js"></script>

</body>

</html>
