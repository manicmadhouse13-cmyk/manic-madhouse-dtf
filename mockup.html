<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Mockup | Manic Madhouse DTF Designs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">

<div class="container">

<a class="navbar-brand" href="index.html">

<img src="images/logo.png">

</a>

</div>

</nav>

<section class="small-hero">

<div class="container text-center">

<h1>Create Your Mockup</h1>

<p>

Upload your artwork and preview it instantly.

</p>

</div>

</section>

<section>

<div class="container">

<div class="row">

<div class="col-lg-4">

<h3>Upload Artwork</h3>

<input type="file"
id="upload"
accept="image/png,image/webp,image/jpeg"
class="form-control">

<br>

<label>

Shirt Colour

</label>

<select id="shirtColor"
class="form-select">

<option value="black">

Black

</option>

<option value="white">

White

</option>

<option value="grey">

Grey

</option>

<option value="navy">

Navy

</option>

<option value="red">

Red

</option>

</select>

<br>

<label>

Design Size

</label>

<input

type="range"

id="scale"

min="80"

max="350"

value="180"

class="form-range">

<br>

<button class="btn btn-primary w-100"
id="resetBtn">

Reset Position

</button>

</div>

<div class="col-lg-8">

<div id="mockupArea">

<img

id="shirt"

src="images/mockups/black-shirt.png">

<img

id="design">

</div>

</div>

</div>

</div>

</section>

<script src="js/mockup.js"></script>

</body>

</html>
